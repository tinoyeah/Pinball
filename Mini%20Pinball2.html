<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Pinball</title>
<style>
:root{--bg:#070b18;--panel:#111a30;--cyan:#67e8f9;--pink:#fb7185;--gold:#fbbf24;--muted:#a5b4fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#233b70,#070b18 72%);color:#eef2ff;font-family:Inter,system-ui,sans-serif;user-select:none}.app{width:min(96vw,650px);padding:12px 0;text-align:center}h1{margin:0 0 8px;font-size:clamp(1.35rem,5vw,2rem);letter-spacing:7px;color:var(--gold);text-shadow:0 0 20px #f59e0b}.sub{margin:-3px 0 12px;color:var(--muted);font-size:.78rem;letter-spacing:2px}.hud{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:5px;padding:9px;background:#0b1224;border:1px solid #475569;border-radius:16px 16px 0 0}.stat{font-size:.68rem;color:#94a3b8;letter-spacing:1px}.stat b{display:block;margin-top:2px;color:var(--cyan);font-size:1.18rem;letter-spacing:0}.stat:nth-child(2) b{color:var(--gold)}.board{position:relative}.board:after{content:"";position:absolute;inset:0;border-radius:0 0 20px 20px;box-shadow:inset 0 0 35px #000b;pointer-events:none}.game{display:block;width:100%;aspect-ratio:5/8;background:#101d56;border:4px solid #94a3b8;border-top:0;border-radius:0 0 20px 20px;box-shadow:0 22px 60px #000c;touch-action:none}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:13px 0 8px}button,select{border:0;border-radius:11px;padding:10px 16px;font:800 .8rem system-ui;cursor:pointer;color:#06101e;background:var(--gold);box-shadow:0 3px 0 #a16207}button:active{transform:translateY(2px);box-shadow:none}button.blue{background:var(--cyan);box-shadow:0 3px 0 #0e7490}button.dark{background:#334155;color:#e2e8f0;box-shadow:0 3px 0 #1e293b}select{background:#1e293b;color:#e2e8f0;box-shadow:none}.help{margin:8px 0 0;font-size:.78rem;color:#cbd5e1}.toast{height:20px;color:var(--gold);font-weight:800;font-size:.8rem}
</style></head>
<body><main class="app"><h1>NEON PINBALL</h1><div class="sub">ARCADE EDITION · INSERT COIN</div><div class="hud"><div class="stat">PUNTI<b id="score">0</b></div><div class="stat">COMBO ×<b id="combo">1</b></div><div class="stat">PALLINE<b id="balls">3</b></div></div><div class="board"><canvas id="game" class="game" width="500" height="800"></canvas></div><div class="toast" id="toast"></div><div class="toolbar"><button id="start">START GAME</button><button id="launch" class="blue">LANCIAPALLA</button><button id="pause" class="dark">PAUSA</button><select id="mode" aria-label="Difficoltà"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select></div><p class="help">← → / A D per i flipper · SPAZIO per lanciare · tocca i lati sul telefono</p></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=500,H=800,scoreEl=document.getElementById('score'),ballsEl=document.getElementById('balls'),comboEl=document.getElementById('combo'),toastEl=document.getElementById('toast');
let score=0,balls=3,combo=1,state='menu',left=false,right=false,launched=false,shake=0,lastHit=0,audio;
const ball={x:443,y:705,vx:0,vy:0,r:10,trail:[]};
const bumpers=[{x:145,y:205,r:42,pts:100,color:'#fb7185'},{x:355,y:205,r:42,pts:100,color:'#a78bfa'},{x:250,y:330,r:49,pts:150,color:'#fb923c'},{x:135,y:445,r:34,pts:100,color:'#22d3ee'},{x:365,y:445,r:34,pts:100,color:'#22d3ee'}];
const targets=[{x:112,y:115,w:48,h:16,on:0},{x:184,y:115,w:48,h:16,on:0},{x:268,y:115,w:48,h:16,on:0},{x:340,y:115,w:48,h:16,on:0}];
const flippers=[{x:110,y:700,len:105,side:1,a:.42,rest:.42,up:-.2},{x:390,y:700,len:105,side:-1,a:.42,rest:.42,up:-.2}];
function sound(freq=440,dur=.05){try{audio??=new AudioContext();const o=audio.createOscillator(),v=audio.createGain();o.frequency.value=freq;v.gain.setValueAtTime(.06,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function say(t){toastEl.textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>toastEl.textContent='',1300)}function points(n){score+=n*combo;scoreEl.textContent=score;shake=5;sound(220+n, .06)}function resetBall(){ball.x=443;ball.y=705;ball.vx=0;ball.vy=0;ball.trail=[];launched=false}function start(){score=0;balls=3;combo=1;scoreEl.textContent=0;comboEl.textContent=1;ballsEl.textContent=3;state='playing';resetBall();say('READY! LANCIA LA PALLA');sound(330)}function launch(){if(state==='menu'||state==='over')start();if(state==='paused')return;state='playing';launched=true;ball.vx=-3.5;ball.vy=-12;sound(160,.12)}function pause(){if(state==='playing'){state='paused';say('PAUSA')}else if(state==='paused'){state='playing';say('GO!')}}
function segment(ax,ay,bx,by,rad,elastic=.8,spin=0,px=0,py=0){let abx=bx-ax,aby=by-ay,t=((ball.x-ax)*abx+(ball.y-ay)*aby)/(abx*abx+aby*aby);t=Math.max(0,Math.min(1,t));let cx=ax+abx*t,cy=ay+aby*t,dx=ball.x-cx,dy=ball.y-cy,d=Math.hypot(dx,dy),min=ball.r+rad;if(d>=min)return;let nx=dx/(d||1),ny=dy/(d||1);ball.x=cx+nx*min;ball.y=cy+ny*min;let sx=-spin*(cy-py),sy=spin*(cx-px),vn=(ball.vx-sx)*nx+(ball.vy-sy)*ny;if(vn<0){ball.vx-=(1+elastic)*vn*nx;ball.vy-=(1+elastic)*vn*ny;sound(260,.025)}}
function step(){if(state!=='playing')return;const diff=document.getElementById('mode').value,gravity=diff==='hard'?.22:diff==='easy'?.13:.18;for(const f of flippers){const on=f.side===1?left:right,t=on?f.up:f.rest,s=on?.3:.18,old=f.a;f.a+=Math.max(-s,Math.min(s,t-f.a));f.spin=(f.a-old)*f.side}if(!launched)return;ball.vy+=gravity;ball.x+=ball.vx;ball.y+=ball.vy;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>8)ball.trail.shift();if(ball.x<30){ball.x=30;ball.vx=Math.abs(ball.vx)*.92}if(ball.x>470){ball.x=470;ball.vx=-Math.abs(ball.vx)*.92}if(ball.y<42){ball.y=42;ball.vy=Math.abs(ball.vy)*.9}
 for(const b of bumpers){let dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy)||1,min=ball.r+b.r;if(d<min){let nx=dx/d,ny=dy/d;ball.x=b.x+nx*min;ball.y=b.y+ny*min;let dot=ball.vx*nx+ball.vy*ny;ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;let speed=Math.hypot(ball.vx,ball.vy);if(speed<7){ball.vx*=7/speed;ball.vy*=7/speed}b.flash=12;points(b.pts);if(performance.now()-lastHit<1400){combo=Math.min(combo+1,5);comboEl.textContent=combo;say('COMBO ×'+combo)}else{combo=1;comboEl.textContent=1}lastHit=performance.now()}}
 for(const t of targets)if(ball.x>t.x-ball.r&&ball.x<t.x+t.w+ball.r&&ball.y>t.y-ball.r&&ball.y<t.y+t.h+ball.r&&ball.vy<0){t.on=16;ball.vy=Math.abs(ball.vy)*1.08;points(75);if(targets.every(q=>q.on>0)){points(1000);say('BONUS! TUTTI I TARGET');targets.forEach(q=>q.on=0)}}
 segment(55,555,125,595,4);segment(445,555,375,595,4);for(const f of flippers){let tx=f.x+f.side*Math.cos(f.a)*f.len,ty=f.y+Math.sin(f.a)*f.len;segment(f.x,f.y,tx,ty,9,.45,f.spin,f.x,f.y)}if(ball.y>H+30){balls--;ballsEl.textContent=balls;combo=1;comboEl.textContent=1;if(balls<=0){state='over';say('GAME OVER')}else{resetBall();say('LANCIA LA PROSSIMA PALLA')}}for(const b of bumpers)if(b.flash)b.flash--;for(const t of targets)if(t.on)t.on--}
function txt(s,x,y,size,color){ctx.fillStyle=color;ctx.font='800 '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(s,x,y)}function draw(){ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(shake<.2)shake=0}ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#172554');bg.addColorStop(1,'#08112e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#38bdf8';ctx.lineWidth=7;ctx.strokeRect(22,24,456,752);ctx.strokeStyle='#fb7185';ctx.lineWidth=2;ctx.strokeRect(34,37,432,725);txt('NEON ZONE',250,73,20,'#fde68a');ctx.fillStyle='#1e40af';ctx.fillRect(410,90,48,590);ctx.strokeStyle='#67e8f9';ctx.strokeRect(410,90,48,590);txt('LAUNCH',434,120,11,'#a5f3fc');ctx.fillStyle='#fbbf24';ctx.fillRect(427,625,14,47);ctx.beginPath();ctx.arc(434,613,11,0,7);ctx.fillStyle='#fff7ed';ctx.fill();for(const t of targets){ctx.fillStyle=t.on?'#fff':'#22d3ee';ctx.shadowColor=t.on?'#fff':'#22d3ee';ctx.shadowBlur=t.on?18:4;ctx.fillRect(t.x,t.y,t.w,t.h);ctx.shadowBlur=0}for(const b of bumpers){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle=b.flash?'#fff':b.color;ctx.shadowColor=b.color;ctx.shadowBlur=b.flash?28:12;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fef3c7';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,10,0,7);ctx.fillStyle='#fff7ed';ctx.fill()}ctx.strokeStyle='#22d3ee';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(55,555);ctx.lineTo(125,595);ctx.moveTo(445,555);ctx.lineTo(375,595);ctx.stroke();for(const f of flippers){const on=f.side===1?left:right;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.side===1?f.a:Math.PI-f.a);ctx.fillStyle=on?'#fbbf24':'#f97316';ctx.shadowColor=on?'#fde68a':'transparent';ctx.shadowBlur=on?20:0;ctx.fillRect(0,-12,f.len,24);ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fillStyle='#fff7ed';ctx.fill();ctx.restore()}for(let i=0;i<ball.trail.length;i++){ctx.globalAlpha=i/ball.trail.length*.35;ctx.beginPath();ctx.arc(ball.trail[i].x,ball.trail[i].y,ball.r*(i/ball.trail.length),0,7);ctx.fillStyle='#fff';ctx.fill()}ctx.globalAlpha=1;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;if(state==='menu'||state==='over'||state==='paused'){ctx.fillStyle='#050a1ddd';ctx.fillRect(55,280,390,170);txt(state==='menu'?'NEON PINBALL':state==='paused'?'PAUSA':'GAME OVER',250,335,32,'#fbbf24');txt(state==='menu'?'Premi START per iniziare':state==='paused'?'Premi PAUSA per riprendere':'Premi START per una nuova partita',250,375,16,'#fff');txt('Bumper · target · combo · bonus',250,407,13,'#67e8f9')}ctx.restore()}
let last=0,acc=0;function loop(t){const dt=Math.min(50,t-last||16);last=t;acc+=dt;while(acc>16.67){step();acc-=16.67}draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=true;if(['ArrowRight','d','D'].includes(e.key))right=true;if(e.code==='Space')launch();if(e.key==='p'||e.key==='P')pause()});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=false;if(['ArrowRight','d','D'].includes(e.key))right=false});canvas.addEventListener('pointerdown',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();if(e.clientX-r.left<r.width*.45)left=true;else if(e.clientX-r.left>r.width*.55)right=true});addEventListener('pointerup',()=>{left=false;right=false});document.getElementById('start').onclick=start;document.getElementById('launch').onclick=launch;document.getElementById('pause').onclick=pause;loop(0);
</script></body></html>
